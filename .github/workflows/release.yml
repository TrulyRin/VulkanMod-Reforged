name: Build and release

on:
  push:
    branches: ['1.20.1', '1.21.1', '1.21.11']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: |
            17
            21
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assemble verifyBundledLwjgl --no-daemon --console=plain --max-workers=2
      - name: Package release and corresponding source
        id: package
        run: |
          mc=$(sed -n 's/^minecraft_version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          version=$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          echo "minecraft=$mc" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p build/release
          cp build/libs/*.jar build/release/
          git archive --format=zip HEAD -o "build/release/VulkanMod-Reforged-${version}-source.zip"
          cd build/release
          sha256sum *.jar *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: VulkanMod-Reforged-${{ steps.package.outputs.minecraft }}
          path: build/release/
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MC_VERSION: ${{ steps.package.outputs.minecraft }}
          MOD_VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="mc-${MC_VERSION}-${GITHUB_SHA:0:7}"
          gh release create "$tag" build/release/* \
            --target "$GITHUB_SHA" \
            --title "VulkanMod Reforged ${MOD_VERSION}" \
            --notes-file .github/release-notes.txt \
            --prerelease
