plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers.from("src/main/resources/META-INF/accesstransformer.cfg")

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'fml.earlydisplay', 'true'
            systemProperty 'org.lwjgl.util.Debug', 'false'
            systemProperty 'org.lwjgl.util.DebugAllocator', 'false'
            systemProperty 'vulkanmod.compat.externalLod', System.getProperty('vulkanmod.compat.externalLod', 'off')
            systemProperty 'vulkanmod.compat.externalLod.draw', System.getProperty('vulkanmod.compat.externalLod.draw', 'true')
            systemProperty 'vulkanmod.compat.externalLod.debugDraw', System.getProperty('vulkanmod.compat.externalLod.debugDraw', 'false')
            jvmArguments.add('-ea')
            jvmArguments.add('-XX:+UseZGC')
            jvmArguments.add('-XX:SoftMaxHeapSize=1536m')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        vulkanmod {
            sourceSet sourceSets.main
        }
    }
}

project.ext.lwjglVersion = "3.3.3"

project.ext.bundledNatives = ["natives-windows", "natives-linux", "natives-macos", "natives-macos-arm64"]

def host = org.gradle.internal.os.OperatingSystem.current()
project.ext.devNatives = host.windows ? "natives-windows"
        : host.macOsX ? (System.getProperty("os.arch").contains("aarch64") ? "natives-macos-arm64" : "natives-macos")
        : "natives-linux"

dependencies {
    // Standard LWJGL for Vulkan
    implementation "org.lwjgl:lwjgl-vulkan:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-shaderc:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-vma:$lwjglVersion"

    runtimeOnly "org.lwjgl:lwjgl-shaderc:$lwjglVersion:$devNatives"
    runtimeOnly "org.lwjgl:lwjgl-vma:$lwjglVersion:$devNatives"

    // Add to runtime classpath for Dev Runs
    additionalRuntimeClasspath "org.lwjgl:lwjgl-vulkan:$lwjglVersion"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-shaderc:$lwjglVersion"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-vma:$lwjglVersion"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-shaderc:$lwjglVersion:$devNatives"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-vma:$lwjglVersion:$devNatives"

    // Bundle them for production via JarJar
    jarJar "org.lwjgl:lwjgl-vulkan:$lwjglVersion"
    jarJar "org.lwjgl:lwjgl-shaderc:$lwjglVersion"
    jarJar "org.lwjgl:lwjgl-vma:$lwjglVersion"
    bundledNatives.each { n ->
        jarJar "org.lwjgl:lwjgl-shaderc:$lwjglVersion:$n"
        jarJar "org.lwjgl:lwjgl-vma:$lwjglVersion:$n"
    }
    jarJar "org.lwjgl:lwjgl-vulkan:$lwjglVersion:natives-macos"
    jarJar "org.lwjgl:lwjgl-vulkan:$lwjglVersion:natives-macos-arm64"

    // Flywheel backend SPI (runtime ships inside Create's jar-in-jar; compile against the same version)
    compileOnly files("libs/flywheel-neoforge-1.21.1-1.0.6.jar")

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testImplementation "com.google.code.gson:gson:2.10.1"
    testImplementation "it.unimi.dsi:fastutil:8.5.12"
    testImplementation "org.apache.commons:commons-lang3:3.14.0"
    testImplementation "org.lwjgl:lwjgl-opengl:$lwjglVersion"
    testRuntimeOnly "org.lwjgl:lwjgl:$lwjglVersion:$devNatives"
    testRuntimeOnly "org.lwjgl:lwjgl-shaderc:$lwjglVersion:$devNatives"
}

// Ensure JarJar only contains what we want
configurations.jarJar {
    exclude group: 'org.lwjgl', module: 'lwjgl'
    exclude group: 'org.lwjgl', module: 'lwjgl-glfw'
    exclude group: 'org.lwjgl', module: 'lwjgl-opengl'
    exclude group: 'org.lwjgl', module: 'lwjgl-stb'
}


processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

test {
    useJUnitPlatform()
}


java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
    from("COPYING") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
    from("NOTICE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

// Post-process: strip module-info.class from embedded LWJGL JarJar jars.
// Without this, lwjgl-vulkan ends up in its own JPMS module layer,
// invisible to org.lwjgl.glfw in the boot layer, causing:
//   NoClassDefFoundError: org/lwjgl/vulkan/VkInstance
tasks.named('jar') {
    doLast {
        def jarFile = archiveFile.get().asFile
        def tmpDir = new File(temporaryDir, "repack")

        // Extract the fat jar
        tmpDir.deleteDir()
        tmpDir.mkdirs()
        ant.unzip(src: jarFile, dest: tmpDir)

        // Strip module-info.class from each embedded LWJGL jar
        def jarjarDir = new File(tmpDir, "META-INF/jarjar")
        if (jarjarDir.exists()) {
            jarjarDir.listFiles().findAll { it.name.endsWith('.jar') && it.name.startsWith('lwjgl-') }.each { embeddedJar ->
                def stripped = new File(temporaryDir, "stripped-${embeddedJar.name}")
                ant.zip(destfile: stripped) {
                    zipfileset(src: embeddedJar) {
                        exclude(name: 'module-info.class')
                        exclude(name: 'META-INF/versions/*/module-info.class')
                    }
                }
                embeddedJar.delete()
                stripped.renameTo(embeddedJar)
            }

            // Fix metadata.json because NeoForge JarJar generates duplicate identifiers for natives
            def metadataFile = new File(jarjarDir, "metadata.json")
            if (metadataFile.exists()) {
                def slurper = new groovy.json.JsonSlurper()
                def metadata = slurper.parseText(metadataFile.text)
                metadata.jars.each { jarEntry ->
                    def m = (jarEntry.path =~ /-(natives-[a-z0-9-]+)\.jar$/)
                    if (m) {
                        jarEntry.identifier.artifact += "-" + m[0][1]
                    }
                }
                metadataFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
            }
        }

        // Repack
        jarFile.delete()
        ant.zip(destfile: jarFile, basedir: tmpDir)
    }
}

tasks.register('verifyBundledLwjgl') {
    group = 'verification'
    description = 'Verifies that the production jar contains loadable LWJGL Vulkan and native artifacts.'
    dependsOn tasks.named('jar')

    doLast {
        def outputJar = tasks.named('jar').get().archiveFile.get().asFile
        def requiredPaths = [
                "META-INF/jarjar/lwjgl-vulkan-${lwjglVersion}.jar",
                "META-INF/jarjar/lwjgl-vulkan-${lwjglVersion}-natives-macos.jar",
                "META-INF/jarjar/lwjgl-vulkan-${lwjglVersion}-natives-macos-arm64.jar",
                "META-INF/jarjar/lwjgl-shaderc-${lwjglVersion}.jar",
                "META-INF/jarjar/lwjgl-shaderc-${lwjglVersion}-natives-windows.jar",
                "META-INF/jarjar/lwjgl-shaderc-${lwjglVersion}-natives-linux.jar",
                "META-INF/jarjar/lwjgl-shaderc-${lwjglVersion}-natives-macos.jar",
                "META-INF/jarjar/lwjgl-shaderc-${lwjglVersion}-natives-macos-arm64.jar",
                "META-INF/jarjar/lwjgl-vma-${lwjglVersion}.jar",
                "META-INF/jarjar/lwjgl-vma-${lwjglVersion}-natives-windows.jar",
                "META-INF/jarjar/lwjgl-vma-${lwjglVersion}-natives-linux.jar",
                "META-INF/jarjar/lwjgl-vma-${lwjglVersion}-natives-macos.jar",
                "META-INF/jarjar/lwjgl-vma-${lwjglVersion}-natives-macos-arm64.jar",
        ].collect { it.toString() }

        def outer = new java.util.zip.ZipFile(outputJar)
        try {
            requiredPaths.each { path ->
                if (outer.getEntry(path) == null) {
                    throw new GradleException("Missing bundled dependency: ${path}")
                }
            }

            def metadataEntry = outer.getEntry('META-INF/jarjar/metadata.json')
            if (metadataEntry == null) {
                throw new GradleException('Missing META-INF/jarjar/metadata.json')
            }
            def metadata = outer.getInputStream(metadataEntry).withCloseable { stream ->
                new groovy.json.JsonSlurper().parse(stream)
            }
            def metadataPaths = metadata.jars.collect { it.path } as Set
            if (!metadataPaths.containsAll(requiredPaths)) {
                throw new GradleException('JarJar metadata does not list every bundled LWJGL artifact')
            }
            def identifiers = metadata.jars.collect { "${it.identifier.group}:${it.identifier.artifact}" }
            if (identifiers.size() != identifiers.toSet().size()) {
                throw new GradleException('JarJar metadata contains duplicate dependency identifiers')
            }

            def verifyNestedJar = { String path, List<String> requiredEntries ->
                temporaryDir.mkdirs()
                def nestedFile = File.createTempFile('vulkanmod-lwjgl-', '.jar', temporaryDir)
                try {
                    outer.getInputStream(outer.getEntry(path)).withCloseable { input ->
                        nestedFile.withOutputStream { output -> output << input }
                    }
                    def nested = new java.util.zip.ZipFile(nestedFile)
                    try {
                        requiredEntries.each { entry ->
                            if (nested.getEntry(entry) == null) {
                                throw new GradleException("${path} is missing ${entry}")
                            }
                        }
                        if (nested.entries().toList().any { it.name == 'module-info.class'
                                || (it.name.startsWith('META-INF/versions/') && it.name.endsWith('/module-info.class')) }) {
                            throw new GradleException("${path} still contains module-info.class")
                        }
                    } finally {
                        nested.close()
                    }
                } finally {
                    nestedFile.delete()
                }
            }

            verifyNestedJar(requiredPaths[0], ['org/lwjgl/vulkan/VK.class'])
            verifyNestedJar(requiredPaths[1], ['macos/x64/org/lwjgl/vulkan/libMoltenVK.dylib'])
            verifyNestedJar(requiredPaths[2], ['macos/arm64/org/lwjgl/vulkan/libMoltenVK.dylib'])
        } finally {
            outer.close()
        }

        logger.lifecycle("Verified bundled LWJGL Vulkan, shaderc, VMA, and macOS MoltenVK in ${outputJar.name}")
    }
}
